<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>车主中心</title>
  <style>
    :root {
      --ink: #111827;
      --blue: #1463ff;
      --blue-2: #0b48e8;
      --bg: #f5f8fc;
      --shadow: 0 18px 46px rgba(23, 42, 88, .14);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -12%, rgba(28, 103, 255, .25), transparent 30%),
        linear-gradient(180deg, #f7fbff, #e7eef8 70%, #dfe9f8);
    }

    .phone {
      width: min(430px, 100vw);
      min-height: min(932px, 100vh);
      max-height: 100vh;
      overflow: hidden;
      position: relative;
      border-radius: clamp(0px, 7vw, 42px);
      background: var(--bg);
      box-shadow: 0 38px 90px rgba(5, 21, 55, .28);
    }

    .screen {
      height: 100vh;
      max-height: 932px;
      overflow-y: auto;
      padding-bottom: 126px;
      background: var(--bg);
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar { display: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px 18px 14px;
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 20px;
      color: white;
      background:
        radial-gradient(circle at 72% 18%, rgba(43, 112, 255, .42), transparent 28%),
        linear-gradient(145deg, #061631, #08204c 60%, #04122c);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .back {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.16);
      font-size: 24px;
      line-height: 1;
    }

    .title { min-width: 0; text-align: left; }

    .title strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 850;
    }

    .title span {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.66);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    main { padding: 18px 16px 0; }

    .thinking {
      margin: 2px 0 18px 0;
      padding: 13px 14px;
      width: max-content;
      max-width: 100%;
      max-height: 54px;
      overflow: hidden;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #1458d6;
      background: rgba(20,99,255,.08);
      border: 1px solid rgba(20,99,255,.1);
      font-size: 13px;
      font-weight: 760;
      animation: thinkingExit 1.25s ease forwards;
    }

    .thinking-dots { display: flex; gap: 4px; }

    .thinking-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1463ff;
      animation: pulse 1.1s infinite ease-in-out;
    }

    .thinking-dots span:nth-child(2) { animation-delay: .16s; }
    .thinking-dots span:nth-child(3) { animation-delay: .32s; }

    @keyframes pulse {
      0%, 100% { opacity: .25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    @keyframes thinkingExit {
      0%, 78% { opacity: 1; max-height: 54px; margin-bottom: 18px; padding-top: 13px; padding-bottom: 13px; }
      100% { opacity: 0; max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-color: transparent; }
    }

    .panel {
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(14px);
      animation: revealIn .48s ease forwards;
    }

    .panel:first-of-type { animation-delay: 1.05s; }

    .panel[hidden] { display: none; }

    .panel.is-open { animation: revealIn .42s ease forwards; }

    @keyframes revealIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .owner-image {
      width: 100%;
      display: block;
      border: 0;
      border-radius: 26px;
      background: white;
      box-shadow: var(--shadow);
    }

    .image-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 26px;
      background: transparent;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }

    .image-button:focus-visible {
      outline: 3px solid rgba(20, 99, 255, .24);
      outline-offset: 3px;
    }

    .panel-action {
      width: 100%;
      min-height: 56px;
      margin-top: 12px;
      border-radius: 18px;
      border: 1px solid rgba(99,112,131,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #101b31;
      background: rgba(255,255,255,.96);
      box-shadow: 0 10px 24px rgba(24,42,86,.08);
      font-size: 16px;
      line-height: 1;
      font-weight: 900;
      font-family: inherit;
    }

    .composer {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      padding: 10px;
      border-radius: 28px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 18px 50px rgba(15, 35, 75, .22);
      border: 1px solid rgba(255,255,255,.92);
      backdrop-filter: blur(26px);
      z-index: 20;
    }

    .input-row {
      min-height: 54px;
      display: grid;
      grid-template-columns: 1fr 46px;
      align-items: center;
      gap: 10px;
      padding: 6px 6px 6px 16px;
      border-radius: 22px;
      background: #f7faff;
      border: 1px solid rgba(20, 99, 255, .12);
    }

    .field {
      min-height: 42px;
      display: flex;
      align-items: center;
      color: #8691a3;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 650;
    }

    .voice-btn {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--blue), var(--blue-2));
      box-shadow: 0 10px 22px rgba(20, 99, 255, .28);
    }

    .voice-mark {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .voice-mark span {
      width: 4px;
      border-radius: 999px;
      background: white;
      display: block;
    }

    .voice-mark span:nth-child(1),
    .voice-mark span:nth-child(5) { height: 14px; }
    .voice-mark span:nth-child(2),
    .voice-mark span:nth-child(4) { height: 24px; }
    .voice-mark span:nth-child(3) { height: 34px; }

    .image-load-frame {
      --img-loading-height: 420px;
      position: relative;
      display: block;
      width: 100%;
      min-height: var(--img-loading-height);
      overflow: hidden;
      border-radius: inherit;
      background: linear-gradient(110deg, #eef5ff 8%, #ffffff 18%, #e9f2ff 33%);
      background-size: 220% 100%;
      box-shadow: var(--shadow);
    }

    .image-load-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.78) 48%, transparent 100%);
      transform: translateX(-100%);
      animation: imageShimmer 1.35s ease-in-out infinite;
    }

    .image-load-frame::after {
      content: "图片加载中";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #5f75a3;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .image-load-frame img {
      opacity: 0;
      transition: opacity .28s ease;
    }

    .image-load-frame.is-loaded {
      min-height: 0;
      background: transparent;
    }

    .image-load-frame.is-loaded::before,
    .image-load-frame.is-loaded::after {
      opacity: 0;
      animation: none;
      pointer-events: none;
    }

    .image-load-frame.is-loaded img { opacity: 1; }

    .image-load-frame.is-error::after { content: "图片加载失败"; }

    .owner-image-frame {
      --img-loading-height: 430px;
      border-radius: 26px;
    }

    @keyframes imageShimmer {
      to { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <header class="topbar">
        <a class="back" href="index.html" aria-label="返回首页">‹</a>
        <div class="title">
          <strong>车主中心</strong>
          <span>懂车型｜懂行情｜懂砍价｜懂养车</span>
        </div>
      </header>

      <main>
        <div class="thinking">
          <div class="thinking-dots"><span></span><span></span><span></span></div>
          <span>正在同步你的车主服务，请稍后。</span>
        </div>

        <section class="panel" id="owner-panel" aria-label="车主中心">
          <button class="image-button owner-trigger" type="button" aria-controls="maintenance-panel">
            <img class="owner-image" src="assets/owner-1.png" alt="车主中心服务提醒" />
          </button>
        </section>

        <section class="panel" id="maintenance-panel" hidden aria-label="保养预测">
          <img class="owner-image" src="assets/owner-2.png" alt="保养预测和门店推荐" />
          <button class="panel-action maintenance-trigger" type="button" aria-controls="valuation-panel">查看残值报告</button>
        </section>

        <section class="panel" id="valuation-panel" hidden aria-label="车辆估值">
          <img class="owner-image" src="assets/owner-3.png" alt="当前二手估值和AI建议" />
        </section>
      </main>
    </div>

    <form class="composer" aria-label="继续对话">
      <div class="input-row">
        <div class="field">继续问：比如“帮我预约保养”</div>
        <button class="voice-btn" type="button" aria-label="语音输入">
          <span class="voice-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </span>
        </button>
      </div>
    </form>
  </div>
  <script>
    const setupImageLoading = () => {
      document.querySelectorAll("img").forEach((img) => {
        if (img.dataset.loaderReady) return;

        const frame = document.createElement("span");
        frame.className = "image-load-frame";
        img.classList.forEach((className) => frame.classList.add(`${className}-frame`));
        img.dataset.loaderReady = "true";
        img.decoding = "async";

        img.parentNode.insertBefore(frame, img);
        frame.appendChild(img);

        const markLoaded = () => frame.classList.add("is-loaded");
        const markError = () => frame.classList.add("is-error");

        if (img.complete && img.naturalWidth > 0) {
          markLoaded();
        } else {
          img.addEventListener("load", markLoaded, { once: true });
          img.addEventListener("error", markError, { once: true });
        }
      });
    };

    setupImageLoading();

    const openPanel = (panel) => {
      if (!panel) return;
      const wasHidden = panel.hasAttribute("hidden");
      panel.removeAttribute("hidden");
      panel.classList.add("is-open");
      if (wasHidden) {
        requestAnimationFrame(() => panel.scrollIntoView({ behavior: "smooth", block: "start" }));
      }
    };

    document.querySelector(".owner-trigger")?.addEventListener("click", () => {
      openPanel(document.querySelector("#maintenance-panel"));
    });

    document.querySelector(".maintenance-trigger")?.addEventListener("click", () => {
      openPanel(document.querySelector("#valuation-panel"));
    });
  </script>
</body>
</html>
